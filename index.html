<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-игры</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Переключатель -->
    <div class="tabs">
        <button id="btn-casino" class="active" onclick="switchGame('casino')">🎰 Казино</button>
        <button id="btn-dice" onclick="switchGame('dice')">🎲 Кубик</button>
    </div>

    <!-- Игра 1: Казино -->
    <div id="game-casino" class="game-container active">
        <!-- Здесь будет слот-машина -->
        <div class="slot-machine">
            <div class="reels">
                <div class="reel" id="reel1">7</div>
                <div class="reel" id="reel2">7</div>
                <div class="reel" id="reel3">7</div>
            </div>
        </div>
        <button class="play-btn" onclick="spinCasino()">Крутить</button>
    </div>

    <!-- Игра 2: Кубик -->
    <div id="game-dice" class="game-container">
        <div class="dice-container">
            <!-- 3D кубик на CSS -->
            <div class="dice" id="dice">
                <div class="face front">1</div>
                <div class="face back">6</div>
                <div class="face right">3</div>
                <div class="face left">4</div>
                <div class="face top">2</div>
                <div class="face bottom">5</div>
            </div>
        </div>
        <button class="play-btn" onclick="rollDice()">Бросить</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
